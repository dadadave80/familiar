[workspace]
resolver = "2"
members = ["common", "rules-export", "root", "pet", "items", "bakery", "market", "mock-pool", "season"]

[workspace.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "global-contracts"] }
near-contract-standards = "=5.30.0"
near-sdk-contract-tools = "=4.0.0"
familiar-common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
